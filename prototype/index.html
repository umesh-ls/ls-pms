<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
 --ground:#F7F5F4; --surface:#FFF; --surface-2:#FBF9F8; --raised:#FFF;
 --ink:#1A1614; --ink-2:#554C47; --ink-3:#847A74;
 --rule:#E4DFDC; --rule-2:#EFEBE9;
 --accent:#8B0000; --accent-soft:#F8ECEC; --accent-line:#D9B9B9;
 --ok:#2D6A4F; --ok-soft:#E6F0EB; --warn:#8A5A14; --warn-soft:#F8F0E0; --idle:#7D736E; --idle-soft:#F0EDEB;
 --shadow:0 1px 2px rgba(26,22,20,.05),0 10px 28px -20px rgba(26,22,20,.3);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --ground:#141211; --surface:#1C1918; --surface-2:#232020; --raised:#262221;
 --ink:#EDE9E6; --ink-2:#B5ACA7; --ink-3:#857B76;
 --rule:#332E2B; --rule-2:#282423;
 --accent:#E0938A; --accent-soft:#2B1A18; --accent-line:#4A3330;
 --ok:#6FBF9A; --ok-soft:#16281F; --warn:#D9A85C; --warn-soft:#2A2418; --idle:#8A807A; --idle-soft:#242120;
 --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -20px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
 --ground:#141211; --surface:#1C1918; --surface-2:#232020; --raised:#262221;
 --ink:#EDE9E6; --ink-2:#B5ACA7; --ink-3:#857B76;
 --rule:#332E2B; --rule-2:#282423;
 --accent:#E0938A; --accent-soft:#2B1A18; --accent-line:#4A3330;
 --ok:#6FBF9A; --ok-soft:#16281F; --warn:#D9A85C; --warn-soft:#2A2418; --idle:#8A807A; --idle-soft:#242120;
 --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -20px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
 font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.55;
 -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* chrome */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--rule);
 display:flex;align-items:center;gap:18px;padding:0 20px;height:56px;flex-wrap:wrap}
.brand{font-family:"Lora",Georgia,serif;font-size:17px;font-weight:600;color:var(--accent);white-space:nowrap}
.brand span{color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.1em;
 text-transform:uppercase;margin-left:9px;font-weight:400}
.spacer{flex:1}
.ctl{display:flex;align-items:center;gap:7px}
.ctl label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
select,input[type=text],input[type=date],textarea{background:var(--surface-2);border:1px solid var(--rule);
 border-radius:4px;padding:6px 9px;font-size:13px;max-width:100%}
textarea{width:100%;resize:vertical;line-height:1.5;font-size:13px}
.roles{display:flex;background:var(--surface-2);border:1px solid var(--rule);border-radius:5px;padding:2px;gap:2px}
.roles button{background:none;border:0;padding:5px 12px;border-radius:4px;cursor:pointer;font-size:12.5px;
 font-weight:500;color:var(--ink-2)}
.roles button[aria-pressed="true"]{background:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .roles button[aria-pressed="true"]{color:#2B1A18}}
:root[data-theme="dark"] .roles button[aria-pressed="true"]{color:#2B1A18}

.wrap{max-width:1180px;margin:0 auto;padding:26px 20px 80px;display:flex;flex-direction:column;gap:22px}
.pagehead{display:flex;flex-direction:column;gap:5px}
.pagehead h1{font-family:"Lora",Georgia,serif;font-size:26px}
.pagehead p{margin:0;color:var(--ink-2);max-width:72ch}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3)}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:7px;box-shadow:var(--shadow)}
.card>header{padding:15px 18px;border-bottom:1px solid var(--rule-2);display:flex;align-items:center;
 gap:12px;flex-wrap:wrap}
.card>header h2{font-size:15px}
.card>header p{margin:0;color:var(--ink-3);font-size:12.5px;flex-basis:100%}
.card .body{padding:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}

.pill{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
 padding:3px 8px;border-radius:3px;white-space:nowrap;font-weight:500}
.p-todo{background:var(--idle-soft);color:var(--idle)}
.p-part{background:var(--warn-soft);color:var(--warn)}
.p-done{background:var(--ok-soft);color:var(--ok)}
.p-acc{background:var(--accent-soft);color:var(--accent)}

/* competency rows */
.comp{border:1px solid var(--rule);border-radius:6px;padding:13px 14px;display:flex;flex-direction:column;gap:9px;
 background:var(--surface-2)}
.comp h3{font-size:13.5px}
.comp .desc{color:var(--ink-3);font-size:12.5px;margin:-4px 0 0}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.scale button{width:36px;height:32px;border:1px solid var(--rule);background:var(--surface);border-radius:4px;
 cursor:pointer;font-weight:600;font-size:13px;color:var(--ink-2)}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .scale button[aria-pressed="true"]{color:#2B1A18}}
:root[data-theme="dark"] .scale button[aria-pressed="true"]{color:#2B1A18}
.needex{font-size:12px;color:var(--accent);font-weight:500}
.sidebyside{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.selfchip{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);white-space:nowrap}

/* tables */
.tw{overflow-x:auto;border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:540px}
th,td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--rule-2);vertical-align:middle}
th{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.11em;text-transform:uppercase;
 color:var(--ink-3);background:var(--surface-2);border-bottom:1px solid var(--rule);font-weight:500}
tbody tr:last-child td{border-bottom:0}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:var(--surface-2)}
td.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}

/* buttons */
.btn{background:var(--accent);color:#fff;border:0;border-radius:5px;padding:8px 16px;font-weight:500;
 cursor:pointer;font-size:13px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#2B1A18}}
:root[data-theme="dark"] .btn{color:#2B1A18}
.btn.ghost{background:none;color:var(--ink-2);border:1px solid var(--rule)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:15px}
.field label{font-size:12.5px;font-weight:500}
.field .hint{font-size:12px;color:var(--ink-3)}

/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--rule);border-radius:7px;padding:14px 16px;
 display:flex;flex-direction:column;gap:3px}
.stat .v{font-family:"Lora",Georgia,serif;font-size:27px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat .k{font-size:11.5px;color:var(--ink-3)}
.stat.acc .v{color:var(--accent)}

/* distribution bars */
.dist{display:flex;flex-direction:column;gap:7px}
.dbar{display:grid;grid-template-columns:118px 1fr 42px;gap:11px;align-items:center;font-size:12.5px}
.dbar .track{background:var(--rule-2);border-radius:3px;height:17px;overflow:hidden}
.dbar .fill{background:var(--accent);height:100%;border-radius:3px;min-width:2px;transition:width .35s ease}
.dbar .n{font-family:"IBM Plex Mono",monospace;text-align:right;color:var(--ink-2)}

/* maths inspector */
.calc{background:var(--surface-2);border:1px solid var(--rule);border-radius:6px;padding:14px;
 font-family:"IBM Plex Mono",monospace;font-size:12.5px;line-height:1.85;overflow-x:auto}
.calc .op{color:var(--ink-3)}
.calc .res{color:var(--accent);font-weight:500}
.note{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:6px;padding:12px 14px;
 font-size:12.5px;color:var(--ink-2)}
.note strong{color:var(--ink)}
.empty{color:var(--ink-3);font-size:13px;padding:22px;text-align:center}
.spec{border-left:2px solid var(--accent-line);padding-left:12px;margin:14px 0;font-size:12.5px;color:var(--ink-2)}
.spec b{color:var(--ink);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin-bottom:4px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;cursor:pointer;
 font-size:13.5px;font-weight:500;color:var(--ink-3);margin-bottom:-1px}
.tabs button[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.alert{background:var(--warn-soft);border:1px solid var(--warn);border-radius:6px;padding:14px 16px;
 display:flex;flex-direction:column;gap:9px}
.alert h3{font-size:14px;color:var(--ink)}
.alert p{margin:0;font-size:12.5px;color:var(--ink-2)}
.step{display:grid;grid-template-columns:26px 1fr;gap:11px;align-items:start;font-size:12.5px;color:var(--ink-2)}
.step .n{font-family:"IBM Plex Mono",monospace;color:var(--warn);font-weight:600}
.trend{display:flex;gap:4px;align-items:flex-end;height:38px}
.trend div{width:26px;background:var(--accent);border-radius:2px 2px 0 0;min-height:3px}
.trend div.empty{background:var(--rule-2)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function ratingRM(code){
  const e=BYCODE[code]; if(!e) return null;
  if(e.rm_code && BYCODE[e.rm_code]) return e.rm_code;
  if(e.alloc&&e.alloc.length){const b=[...e.alloc].sort((x,y)=>y.pct-x.pct)[0];
    const lc=LEADCODE[b.project]; if(lc&&lc!==code) return lc;}
  return null;
}
function commenters(code){
  const e=BYCODE[code]; if(!e||!e.alloc) return [];
  const rm=ratingRM(code), agg={};
  e.alloc.forEach(a=>{const lc=LEADCODE[a.project];
    if(!lc||lc===code||lc===rm) return;
    if(!agg[lc])agg[lc]={code:lc,pct:0,projects:[]};
    agg[lc].pct+=a.pct; agg[lc].projects.push(a.project+" "+a.pct+"%");});
  return Object.values(agg).map(x=>({...x,name:(BYCODE[x.code]||{}).name||x.code})).sort((a,b)=>b.pct-a.pct);
}
function finalFor(code,q){ if(!eligible(code,q).ok) return null;

  return a==null?null:Math.round(a*100)/100;}

  const vals=QS.map(q=>({q,v:finalFor(code,q)}));
  const got=vals.filter(x=>x.v!=null);
  const raw=got.length?got.reduce((s,x)=>s+x.v,0)/got.length:null;
  return {vals,got:got.length,raw:raw==null?null:Math.round(raw*100)/100,
          whole:raw==null?null:Math.round(raw)};
}

function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000);}
function eligible(code,q){const e=BYCODE[code],j=doj(e);q=q||S.quarter;

      <div class="stats" style="margin-bottom:14px">
        <div class="stat acc"><span class="v">${(finalFor(S.me)||0).toFixed(2)}</span><span class="k">Released by your manager</span></div>
        <div class="stat"><span class="v">${(avg(r.self.c)||0).toFixed(2)}</span><span class="k">Your self-assessment</span></div></div>
      <div class="spec"><b>What was concluded.</b> ${esc((r.o2o&&r.o2o.text)||"—")}</div>
      <div class="spec"><b>Commitments for next quarter.</b> ${esc(r.commit)||"—"}</div>
      <div class="field" style="margin-top:16px"><label>Your reflection</label>
        <span class="hint">Your own words on the conversation and the rating. Your manager and HR see this; it cannot be edited by them.</span>
        <textarea rows="3" data-act="reflect" data-code="${S.me}" placeholder="What you agree with, what you don't, and what you want to do about it.">${esc(r.reflect||"")}</textarea></div>
      <div class="note">This closes the cycle. In FY26 there was nowhere for this to go, so it went to HR as an email.</div>
    </div></div>`;
  if(S.tab==="month") return hd+picker+T+`<div class="card"><header><h2>Monthly record</h2>
    <p>Submitted month by month. Optional for you, expected of your manager.</p></header>
    <div class="body" style="display:flex;flex-direction:column;gap:11px">
      ${QMONTHS[S.quarter].map(m=>monthBlock(S.me,m,S.quarter,"employee")).join("")}${QNOTE}</div></div>`;
  return hd+picker+T+`
  <div class="card"><header><h2>Your quarter</h2></header><div class="body">
    <div class="field"><label>What did you work on, and what did you deliver?</label>
      <textarea rows="3" data-act="did">${esc(self.did)}</textarea></div>
    <div class="field"><label>What got in the way?</label>
      <textarea rows="2" data-act="blk">${esc(self.blk)}</textarea></div></div></div>
  <div class="card"><header><h2>Competency self-assessment</h2>
    <p>1 Unsatisfactory · 2 Needs Improvement · 3 Meets Expectations · 4 Exceeds Expectations · 5 Outstanding.
      An example is required at 4 or 5 — in FY26 only a 5 needed one, which is why 42 of 73 people landed on 4 or 5.
      Delivery &amp; Accountability and Technical / Functional Skill carry double weight.</p></header>
    <div class="body" style="display:flex;flex-direction:column;gap:11px">
      ${COMPS.map((c,i)=>`<div class="comp"><h3>${esc(compLabel(i))}</h3><p class="desc">${esc(cdesc(i,S.me))}</p>
        ${scaleRow(i,self.c[i],"selfrate",self.ex[i],"selfex")}</div>`).join("")}
      <div class="row" style="justify-content:space-between">
        <span class="selfchip">Self average ${avg(self.c)?avg(self.c).toFixed(2):"—"} · recorded, not counted in the score</span>
        <button class="btn" data-act="noop" ${avg(self.c)==null?"disabled":""}>Submit self-assessment</button></div></div></div>`;
}

/* ---------------- ANNUAL ROLL-UP ---------------- */
function annualCard(code,showName){
  const a=annual(code), e=BYCODE[code], mx=5;
  const low=lowFlag(code);
  return `<div class="card"><header><h2>${showName?esc(e.name)+" — ":""}FY27 roll-up</h2>
    <p>Every quarter, how it was produced, and what it averages to. This is the audit trail FY26 did not have.</p></header>
    <div class="body">
      <div class="stats" style="margin-bottom:16px">
        ${a.vals.map(x=>`<div class="stat"><span class="v">${x.v!=null?x.v.toFixed(2):"—"}</span>
          <span class="k">${esc(x.q)} · ${esc(QLABEL[x.q])}</span></div>`).join("")}
        <div class="stat acc"><span class="v">${a.raw!=null?a.raw.toFixed(2):"—"}</span>
          <span class="k">Annual average of ${a.got} quarter${a.got===1?"":"s"}</span></div>
      </div>
      <div class="trend" style="margin-bottom:14px">${a.vals.map(x=>
        `<div class="${x.v==null?"empty":""}" style="height:${x.v==null?6:Math.max(6,x.v/mx*38)}px" title="${esc(x.q)} ${x.v!=null?x.v.toFixed(2):"no rating"}"></div>`).join("")}</div>
      <div class="calc">${a.got?a.vals.filter(x=>x.v!=null).map(x=>`<span class="op">${esc(x.q)}</span> ${x.v.toFixed(2)}`).join("<br>")
        +`<br><span class="op">÷ ${a.got} =</span> <span class="res">${a.raw.toFixed(2)}</span>`
        +`<br><span class="op">rounded for the appraisal matrix =</span> <span class="res">${a.whole}</span>`:'<span class="op">No quarters rated yet.</span>'}</div>
      ${a.whole!=null?`<div class="spec" style="margin-top:14px"><b>Feeds the appraisal matrix as a ${a.whole}.</b>
        The existing rating × grade grid turns that into an increment percentage for ${esc(e.grade||"their grade")}.
        Any manual override of this number must carry a written reason — the unrecorded override was the FY26 failure point.</div>`:""}
      ${low?`<div class="alert" style="margin-top:14px"><h3>Flagged — ${esc(low)}</h3>
        <p>A low rating has to lead somewhere. See the performance note on the quarterly review.</p></div>`:""}
    </div></div>`;
}

/* ---------------- MANAGER ---------------- */
function viewManager(){
  const set={}; EMP.forEach(e=>{const rm=ratingRM(e.code); if(rm) set[rm]=true;});
  const list=Object.keys(set).filter(c=>BYCODE[c]).sort((a,b)=>BYCODE[a].name.localeCompare(BYCODE[b].name));
  if(!list.includes(S.mgr)) S.mgr=list[0];
  const team=EMP.filter(e=>e.code!==S.mgr&&ratingRM(e.code)===S.mgr);
  const m=BYCODE[S.mgr];
  if(S.open) return viewReview(S.open);
  const T=tabs([["month","Monthly notes"],["quarter","Quarterly reviews"],["year","Annual roll-up"]]);
  const hd=`<div class="pagehead"><p class="eyebrow">Manager view · ${esc(S.quarter)} ${esc(QLABEL[S.quarter])}</p>
    <h1>Your team</h1></div>
   <div class="card"><div class="body"><div class="row">
     <label class="eyebrow" for="mg">View as manager</label>
     <select id="mg" data-act="setmgr" style="min-width:250px">${list.map(c=>opt(BYCODE[c].name+" · "+BYCODE[c].desig,c,S.mgr)).join("")}</select>
     <span class="pill p-acc">${team.length} direct</span></div>
     <div class="spec" style="margin-bottom:0"><b>${esc(m.name)}</b> · ${esc(m.desig)} · ${esc(m.dept)}</div></div></div>`;
  if(!team.length) return hd+T+'<div class="card"><div class="empty">Nobody is rated by this person.</div></div>';
  if(S.tab==="year") return hd+T+`<div class="card"><header><h2>Annual roll-up</h2>
    <p>Quarter by quarter for everyone you rate.</p></header><div class="tw"><table><thead><tr>
    <th>Person</th>${QS.map(q=>`<th>${esc(q.replace("FY27-",""))}</th>`).join("")}<th>Annual</th><th>Flag</th></tr></thead><tbody>
    ${team.map(e=>{const a=annual(e.code),lf=lowFlag(e.code);return `<tr class="clickable" data-act="open" data-code="${e.code}">
      <td><b>${esc(e.name)}</b></td>${a.vals.map(x=>`<td class="num">${x.v!=null?x.v.toFixed(2):"—"}</td>`).join("")}
      <td class="num"><b>${a.raw!=null?a.raw.toFixed(2):"—"}</b></td>
      <td>${lf?'<span class="pill p-part">'+esc(lf)+'</span>':""}</td></tr>`;}).join("")}
    </tbody></table></div></div>`;
  if(S.tab==="month") return hd+T+`<div class="card"><header><h2>Monthly notes — ${esc(MNAME[NOW_MONTH])}</h2>
    <p>One or two lines per person, every month. The only thing expected of you monthly, and the thing that makes the quarterly rating defensible.</p></header>
    <div class="body" style="display:flex;flex-direction:column;gap:10px">
    ${team.map(e=>{const cur=getLog(e.code,NOW_MONTH,"manager");
      return `<div class="comp"><div class="row" style="justify-content:space-between"><h3>${esc(e.name)}</h3>
        ${cur?'<span class="pill p-done">Recorded</span>':'<span class="pill p-todo">Pending</span>'}</div>
        <textarea rows="2" data-act="mlog" data-code="${e.code}" data-m="${NOW_MONTH}" data-who="manager"
          placeholder="What they did · What you noticed · Anything to flag">${esc(cur?cur.text:"")}</textarea></div>`;}).join("")}
    ${QNOTE}</div></div>`;
  return hd+T+`<div class="card"><header><h2>Quarterly reviews</h2><p>Click a row to open.</p></header>
   <div class="tw"><table><thead><tr><th>Person</th><th>Designation</th><th>Monthly lines</th><th>Self</th><th>Rating</th><th>Gap</th><th>Status</th></tr></thead><tbody>
   ${team.map(e=>{const r=rec(e.code),sa=r.self?avg(r.self.c):null,f=finalFor(e.code);
     const lines=QMONTHS[S.quarter].filter(m=>getLog(e.code,m,"manager")||getLog(e.code,m,"employee")).length;
     return `<tr class="clickable" data-act="open" data-code="${e.code}">
      <td><b>${esc(e.name)}</b><br><span class="mono" style="font-size:11px;color:var(--ink-3)">${esc(e.code)}</span></td>
      <td>${esc(e.desig)}</td><td class="num">${lines}/3</td><td class="num">${sa?sa.toFixed(2):"—"}</td>
      <td class="num">${f!=null?f.toFixed(2):"—"}</td>
      <td class="num">${(()=>{const g=gapFor(e.code);return g==null?"—":
        (Math.abs(g)>=1?'<span class="pill p-part">'+(g>0?"+":"")+g.toFixed(2)+'</span>':(g>0?"+":"")+g.toFixed(2));})()}</td>
      <td><span class="pill ${PILL[statusOf(e.code)]}">${esc(statusOf(e.code))}</span></td></tr>`;}).join("")}
   </tbody></table></div></div>`;
}

function viewReview(code){
  const e=BYCODE[code], r=rec(code), self=r.self, f=finalFor(code), low=lowFlag(code);
  const sub=r.rm||{c:Array(NC).fill(null),ex:Array(NC).fill("")};
  const cms=commenters(code);
  const alloc=e.alloc&&e.alloc.length?e.alloc.map(a=>esc(a.project)+" "+a.pct+"%").join(" · "):"On bench — no project allocation";
  return `
  <div class="pagehead"><p class="eyebrow">Manager view · review · ${esc(S.quarter)}</p><h1>${esc(e.name)}</h1>
    <p>${esc(e.desig)} · ${esc(e.dept)} · ${esc(e.grade||"grade not set")}</p></div>
  <div class="row"><button class="btn ghost" data-act="back">← Back to team</button></div>

  ${(()=>{const el=eligible(code);return el.ok?"":`<div class="card"><div class="body">
    <div class="alert"><h3>Not applicable this quarter</h3><p>${esc(el.why)}. No rating is produced, and this quarter is left out of the annual average rather than counted as a weak one.</p></div></div></div>`;})()}
  <div class="card"><header><h2>Objective context</h2>
    <p>Straight from Edge. Not a rating — the factual frame the conversation sits in.</p></header>
    <div class="body"><div class="spec" style="margin-bottom:0"><b>Allocation this quarter.</b> ${esc(alloc)}
      ${e.totalPct>100?` <span class="pill p-part">over-allocated at ${e.totalPct}%</span>`:""}
      ${e.totalPct===0?' <span class="pill p-part">0% allocated</span>':""}</div></div></div>

  <div class="card"><header><h2>Monthly record</h2>
    <p>Written through the quarter, not recalled at the end. The evidence behind your rating.</p></header>
    <div class="body" style="display:flex;flex-direction:column;gap:10px">
      ${QMONTHS[S.quarter].map(m=>monthBlock(code,m,S.quarter,"manager")).join("")}${QNOTE}</div></div>

  ${cms.length?`<div class="card"><header><h2>Other project leads</h2>
    <p>They comment, you rate. Weighted multi-rater scoring comes in the next phase.</p></header>
    <div class="body" style="display:flex;flex-direction:column;gap:10px">
    ${cms.map(c=>`<div class="comp"><div class="row" style="justify-content:space-between">
      <h3>${esc(c.name)}</h3><span class="selfchip">${esc(c.projects.join(", "))}</span></div>
      <textarea rows="2" data-act="cmt" data-code="${code}" data-rc="${c.code}"
        placeholder="What this lead saw on their project.">${esc(r.comments[c.code]||"")}</textarea></div>`).join("")}
    </div></div>`:""}

  <div class="card"><header><h2>What they said</h2></header><div class="body">
    ${self?`<div class="spec"><b>Delivered.</b> ${esc(self.did)||"—"}</div><div class="spec"><b>Got in the way.</b> ${esc(self.blk)||"—"}</div>`
      :'<div class="empty">Self-assessment not submitted yet.</div>'}</div></div>

  <div class="card"><header><h2>Your rating</h2></header>
    <div class="body" style="display:flex;flex-direction:column;gap:11px">
      ${COMPS.map((c,i)=>`<div class="comp"><h3>${esc(compLabel(i))}</h3><p class="desc">${esc(cdesc(i,code))}</p>
        <div class="sidebyside"><span class="selfchip">Self ${self&&self.c[i]?self.c[i]:"—"}</span></div>
        ${scaleRow(i,sub.c[i],"mgrrate",sub.ex[i],"mgrex")}</div>`).join("")}
      <div class="row" style="justify-content:space-between">
        <span class="selfchip">Quarterly rating ${f!=null?f.toFixed(2):"—"}</span>
        <button class="btn" data-act="noop" ${f==null?"disabled":""}>Submit rating</button></div></div></div>

  ${low?`<div class="card"><header><h2>Performance note required</h2></header><div class="body">
    <div class="alert"><h3>${esc(low)}</h3>
      <p>A low rating has to lead somewhere, on a clock, in writing. Catching this in a quarter leaves time to fix it; catching it in April leaves none.</p>
      <div class="step"><span class="n">1</span><span>Describe what specifically is below standard — observable behaviour or missed work, not a score.</span></div>
      <div class="step"><span class="n">2</span><span>Agree two or three improvements with a date, 30 days out. Countersigned by the HR head so it cannot be used as a weapon.</span></div>
      <div class="step"><span class="n">3</span><span>Review at 30 days — improved, partly, or not. Recorded either way.</span></div>
      <div class="step"><span class="n">4</span><span>If not improved, a formal plan at 60 days with the possible outcomes stated upfront.</span></div>
    </div>
    <div class="field" style="margin-top:14px"><label>What specifically is below standard?</label>
      <textarea rows="2" data-act="pnote" data-code="${code}">${esc((r.pnote&&r.pnote.what)||"")}</textarea></div>
    <div class="field"><label>Two or three improvements, with a 30-day date</label>
      <textarea rows="3" data-act="pnote2" data-code="${code}">${esc((r.pnote&&r.pnote.steps)||"")}</textarea></div>
    <div class="selfchip">Goes to the HR head for countersignature before it reaches the employee.</div>
  </div></div>`:""}

  ${(()=>{const g=gapFor(code);if(g==null)return"";
    const big=Math.abs(g)>=1;
    return `<div class="card"><header><h2>Before you have the conversation</h2></header><div class="body">
    <div class="${big?"alert":"note"}">${big?`<h3>Self-rating is ${g>0?"":"below "}${Math.abs(g).toFixed(2)} ${g>0?"above":""} yours</h3>
      <p>A gap this size is where the 1:1 goes wrong. Decide now which two competencies you will evidence, and open with those rather than the number.</p>`
      :`Self ${(rec(code).self&&avg(rec(code).self.c)).toFixed(2)} against your ${(avg(rec(code).rm.c)).toFixed(2)} — a gap of ${(g>0?"+":"")+g.toFixed(2)}. Close enough that the conversation should be straightforward.`}</div>
    <div class="tw" style="margin-top:12px"><table><thead><tr><th>Competency</th><th>Self</th><th>You</th><th>Gap</th></tr></thead><tbody>
    ${COMPS.map((c,i)=>{const sv=rec(code).self.c[i],mv=rec(code).rm.c[i],d=sv-mv;
      return `<tr><td>${esc(compLabel(i))}</td><td class="num">${sv}</td><td class="num">${mv}</td>
      <td class="num">${Math.abs(d)>=2?'<span class="pill p-part">'+(d>0?"+":"")+d+'</span>':(d>0?"+":"")+d}</td></tr>`;}).join("")}
    </tbody></table></div></div></div>`;})()}

  <div class="card"><header><h2>The conversation</h2>
    <p>Not complete until the 1:1 has happened and the conclusion is recorded.</p></header><div class="body">
    <div class="field"><label>What was concluded — agreed by both. The employee sees this.</label>
      <textarea rows="3" data-act="o2o" data-code="${code}">${esc((r.o2o&&r.o2o.text)||"")}</textarea></div>
    <div class="field"><label>Commitments for next quarter — two or three</label>
      <span class="hint">Plain expectations, not KPIs. These become what next quarter is rated against, and they are the closest thing to objective ground until KPIs exist.</span>
      <textarea rows="3" data-act="commit" data-code="${code}">${esc(r.commit)}</textarea></div>
    <div class="field"><label>Note to leadership — not visible to the employee</label>
      <textarea rows="2" data-act="lead" data-code="${code}">${esc(r.lead)}</textarea></div>
    <button class="btn" data-act="closeo2o" data-code="${code}" ${f==null?"disabled":""}>Mark 1:1 held and release rating</button>
    ${r.o2o&&r.o2o.held?`<div class="field" style="margin-top:16px"><label>Employee's own reflection — written by them, after the conversation</label>
      <span class="hint">Read-only for you. The loop that FY26 never closed: people who feel unheard write to HR instead.</span>
      <div class="spec" style="margin:0">${esc(r.reflect||"Not yet written.")}</div></div>`:""}
  </div></div>`;
}

/* ---------------- HR ---------------- */
function viewHR(){
  const T=tabs([["month","Cycle status"],["year","Annual roll-up"],["flags","Needs attention"]]);
  const hd=`<div class="pagehead"><p class="eyebrow">HR view · cycle administrator</p>
    <h1>${esc(S.quarter)} · ${esc(QLABEL[S.quarter])}</h1></div>
    <div class="row"><button class="btn ghost" data-act="seed">${S.seeded?"Clear sample data":"Load sample data"}</button>
      <span class="selfchip">Sample data is illustrative only — not real ratings.</span></div>`;
  if(S.tab==="flags"){
    const flagged=EMP.map(e=>({e,f:lowFlag(e.code),a:annual(e.code)})).filter(x=>x.f);
    const stuck=EMP.filter(e=>statusOf(e.code)==="Not started");
    return hd+T+`<div class="card"><header><h2>Low ratings</h2>
      <p>Trigger: a quarter below ${LOW_Q.toFixed(1)}, or two consecutive quarters below ${LOW_RUN.toFixed(1)}. Each needs a performance note within 7 days.</p></header>
      ${flagged.length?`<div class="tw"><table><thead><tr><th>Person</th><th>Manager</th><th>Trigger</th><th>Annual</th></tr></thead><tbody>
      ${flagged.map(x=>`<tr><td>${esc(x.e.name)}</td><td>${esc((BYCODE[ratingRM(x.e.code)]||{}).name||"—")}</td>
        <td><span class="pill p-part">${esc(x.f)}</span></td><td class="num">${x.a.raw!=null?x.a.raw.toFixed(2):"—"}</td></tr>`).join("")}
      </tbody></table></div>`:'<div class="empty">No one flagged. Load sample data to see this populate.</div>'}</div>
      <div class="card"><header><h2>Not started</h2><p>${stuck.length} people have not begun this quarter.</p></header>
      <div class="tw"><table><thead><tr><th>Person</th><th>Department</th><th>Manager</th></tr></thead><tbody>
      ${stuck.slice(0,20).map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.dept)}</td>
        <td>${esc((BYCODE[ratingRM(e.code)]||{}).name||"—")}</td></tr>`).join("")}
      </tbody></table></div></div>`;
  }
  if(S.tab==="year"){
    const sel=S.inspect&&BYCODE[S.inspect]?S.inspect:null;
    return hd+T+`<div class="card"><header><h2>Annual roll-up</h2>
      <p>Pick anyone to see how their four quarters become one number.</p></header>
      <div class="body"><select data-act="inspect" style="min-width:270px">
        <option value="">Select a person…</option>
        ${EMP.map(x=>opt(x.name+" · "+x.dept,x.code,sel)).join("")}</select></div></div>
      ${sel?annualCard(sel,true):'<div class="card"><div class="empty">Choose a person.</div></div>'}
      <div class="card"><header><h2>Whole organisation</h2></header><div class="tw"><table><thead><tr>
      <th>Person</th><th>Department</th>${QS.map(q=>`<th>${esc(q.replace("FY27-",""))}</th>`).join("")}<th>Annual</th></tr></thead><tbody>
      ${EMP.slice(0,30).map(e=>{const a=annual(e.code);return `<tr><td>${esc(e.name)}</td><td>${esc(e.dept)}</td>
        ${a.vals.map(x=>`<td class="num">${x.v!=null?x.v.toFixed(2):"—"}</td>`).join("")}
        <td class="num"><b>${a.raw!=null?a.raw.toFixed(2):"—"}</b></td></tr>`;}).join("")}
      </tbody></table></div><div class="body"><span class="selfchip">Showing 30 of ${EMP.length}.</span></div></div>`;
  }
  const rows=EMP.map(e=>({e,st:statusOf(e.code),f:finalFor(e.code)}));
  const cnt={}; ["Not started","Self done","Manager done","Closed"].forEach(k=>cnt[k]=0);
  rows.forEach(r=>cnt[r.st]++);
  const rated=rows.filter(r=>r.f!=null), band=[0,0,0,0,0];
  rated.forEach(r=>band[Math.min(4,Math.max(0,Math.round(r.f)-1))]++);
  const mx=Math.max(1,...band);
  const mlines=EMP.reduce((s,e)=>s+(getLog(e.code,NOW_MONTH,"manager")?1:0),0);
  return hd+T+`
  <div class="stats">
    <div class="stat"><span class="v">${EMP.length}</span><span class="k">In scope</span></div>
    <div class="stat"><span class="v">${cnt["Not started"]}</span><span class="k">Not started</span></div>
    <div class="stat"><span class="v">${cnt["Self done"]+cnt["Manager done"]}</span><span class="k">In progress</span></div>
    <div class="stat acc"><span class="v">${cnt["Closed"]}</span><span class="k">Closed</span></div>
    <div class="stat"><span class="v">${mlines}</span><span class="k">${esc(MNAME[NOW_MONTH])} notes in</span></div>
  </div>
  <div class="grid2">
    <div class="card"><header><h2>Rating distribution</h2><p>${rated.length} of ${EMP.length} rated.</p></header>
      <div class="body"><div class="dist">${band.map((n,i)=>`<div class="dbar"><span>${i+1} ${esc(SCALE[i])}</span>
        <div class="track"><div class="fill" style="width:${n/mx*100}%"></div></div><span class="n">${n}</span></div>`).join("")}</div>
        <div class="note" style="margin-top:14px">FY26 put <strong>42 of 73 people at 4 or 5</strong>. If this clusters the same way, the evidence requirement is not biting.</div></div></div>
    <div class="card"><header><h2>By department</h2></header><div class="tw"><table><thead><tr>
      <th>Department</th><th>People</th><th>Closed</th><th>Monthly notes</th></tr></thead><tbody>
      ${[...new Set(EMP.map(e=>e.dept))].map(d=>{const g=rows.filter(r=>r.e.dept===d);
        const ml=g.filter(r=>getLog(r.e.code,NOW_MONTH,"manager")).length;
        return `<tr><td>${esc(d)}</td><td class="num">${g.length}</td>
          <td class="num">${g.filter(r=>r.st==="Closed").length}</td><td class="num">${ml}</td></tr>`;}).join("")}
      </tbody></table></div></div>
  </div>
  <div class="card"><header><h2>By manager — the outlier check</h2>
    <p>Not full calibration, just visibility. 25 managers rating on 25 private scales is how FY26 ended up normalising centrally and catching managers unaware. Flagged above 4.20 or below 2.80.</p></header>
    <div class="tw"><table><thead><tr><th>Manager</th><th>Department</th><th>Team</th><th>Rated</th><th>Their average</th><th></th></tr></thead><tbody>
    ${(()=>{const set={};EMP.forEach(e=>{const rm=ratingRM(e.code);if(rm)set[rm]=true;});
      const rows=Object.keys(set).filter(c=>BYCODE[c]).map(c=>({c,m:BYCODE[c],s:mgrStats(c)}))
        .filter(x=>x.s.rated>0).sort((a,b)=>(b.s.avg||0)-(a.s.avg||0));
      return rows.length?rows.map(x=>{const out=x.s.avg>4.2||x.s.avg<2.8;
        return `<tr><td>${esc(x.m.name)}</td><td>${esc(x.m.dept)}</td><td class="num">${x.s.n}</td>
        <td class="num">${x.s.rated}</td><td class="num"><b>${x.s.avg.toFixed(2)}</b></td>
        <td>${out?'<span class="pill p-part">outlier</span>':""}</td></tr>`;}).join("")
        :'<tr><td colspan="6" class="empty">No ratings yet. Load sample data to see this populate.</td></tr>';})()}
    </tbody></table></div></div>

  <div class="card"><header><h2>Quarter control</h2>
    <p>The cycle administrator — the HR head — opens and closes each quarter, chases non-submitters, and handles mid-quarter manager changes, leavers and new joiners.</p></header>
    <div class="body">
    <div class="spec"><b>Mid-quarter manager change.</b> The reporting manager at quarter close rates. The outgoing manager must leave a handover note in the monthly record before the change takes effect.</div>
    <div class="spec"><b>New joiners and leavers.</b> Fewer than ${MIN_DAYS} days with the rating manager in the quarter means Not applicable — no rating, and the quarter is excluded from the annual average rather than dragging it down.</div>
    <div class="spec"><b>Audit trail.</b> Every submission, edit and release is logged with who and when. Required for ISO 27001 evidence, and the thing that makes an override arguable rather than silent.</div>
    <div class="tw" style="margin-top:12px"><table><thead><tr><th>Quarter</th><th>Months</th><th>State</th></tr></thead><tbody>
    ${QS.map(q=>`<tr><td>${esc(q)} · ${esc(QLABEL[q])}</td>
      <td style="font-size:12px;color:var(--ink-3)">${QMONTHS[q].map(m=>esc(MNAME[m].split(" ")[0])).join(" · ")}</td>
      <td>${QCLOSED[q]?'<span class="pill p-done">Closed</span>':'<span class="pill p-acc">Open — months still editable</span>'}</td></tr>`).join("")}
    </tbody></table></div></div></div>`;
}

/* ---------------- sample ---------------- */
function seed(){
  if(S.seeded){S.reviews={};S.logs={};S.seeded=false;return;}
  EMP.forEach(e=>{
    const h=[...e.code].reduce((s,c)=>s+c.charCodeAt(0),0);
    QS.forEach((q,qi)=>{
      if(qi>2) return;
      const r=rec(e.code,q);
      if(h%10<2) return;
      r.self={c:COMPS.map((_,i)=>3+((h+i*7)%3===0?1:0)),ex:COMPS.map(()=>""),did:"",blk:""};
      if(h%10<4) return;
      r.rm={c:COMPS.map((_,i)=>Math.max(1,Math.min(5,2+((h+i*5+qi*3)%4)))),ex:COMPS.map(()=>"")};
      if(h%10>=8) r.o2o={held:true,text:"Sample conversation record."};
    });
    if(h%3===0) setLog(e.code,NOW_MONTH,"manager","Sample monthly note.");
  });
  S.seeded=true;
}

/* ---------------- render ---------------- */
const TABS_OK={employee:["month","quarter","year"],manager:["month","quarter","year"],hr:["month","year","flags"]};
function render(){
  if(!TABS_OK[S.role].includes(S.tab)) S.tab=TABS_OK[S.role][0];
  document.getElementById("app").innerHTML=S.role==="employee"?viewEmployee():S.role==="manager"?viewManager():viewHR();
  document.querySelectorAll("#roles button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.r===S.role));
}
document.getElementById("roles").addEventListener("click",ev=>{const b=ev.target.closest("button[data-r]");if(!b)return;
  S.role=b.dataset.r;S.open=null;S.tab=TABS_OK[S.role][0];render();});
document.getElementById("q").addEventListener("change",ev=>{S.quarter=ev.target.value;S.open=null;render();});
document.getElementById("app").addEventListener("click",ev=>{
  const t=ev.target.closest("[data-act]");if(!t)return;
  const a=t.dataset.act,i=+t.dataset.i,v=+t.dataset.v,code=t.dataset.code;
  if(a==="tab"){S.tab=t.dataset.t;S.open=null;render();}
  else if(a==="selfrate"){const r=rec(S.me);r.self=r.self||{c:Array(NC).fill(null),ex:Array(NC).fill(""),did:"",blk:""};
    r.self.c[i]=v;render();}
  else if(a==="mgrrate"){const r=rec(S.open);r.rm=r.rm||{c:Array(NC).fill(null),ex:Array(NC).fill("")};
    r.rm.c[i]=v;render();}
  else if(a==="open"){S.open=code;S.tab="quarter";render();}
  else if(a==="back"){S.open=null;render();}
  else if(a==="closeo2o"){const r=rec(code);r.o2o={held:true,text:(r.o2o&&r.o2o.text)||""};S.open=null;render();}
  else if(a==="seed"){seed();render();}
});
document.getElementById("app").addEventListener("change",ev=>{
  const t=ev.target.closest("[data-act]");if(!t)return;
  if(t.dataset.act==="setme"){S.me=t.value;render();}
  else if(t.dataset.act==="setmgr"){S.mgr=t.value;S.open=null;render();}
  else if(t.dataset.act==="inspect"){S.inspect=t.value||null;render();}
});
document.getElementById("app").addEventListener("input",ev=>{
  const t=ev.target.closest("[data-act]");if(!t)return;
  const a=t.dataset.act,i=+t.dataset.i,code=t.dataset.code;
  if(a==="mlog"){setLog(t.dataset.code,t.dataset.m,t.dataset.who,t.value);return;}
  const r=code?rec(code):rec(S.me);
  if(a==="did"||a==="blk"){r.self=r.self||{c:Array(NC).fill(null),ex:Array(NC).fill(""),did:"",blk:""};r.self[a]=t.value;}
  else if(a==="selfex"){r.self.ex[i]=t.value;}
  else if(a==="mgrex"){rec(S.open).rm.ex[i]=t.value;}
  else if(a==="cmt"){r.comments[t.dataset.rc]=t.value;}
  else if(a==="o2o"){r.o2o=r.o2o||{held:false,text:""};r.o2o.text=t.value;}
  else if(a==="commit"){r.commit=t.value;}
  else if(a==="lead"){r.lead=t.value;}
  else if(a==="pnote"){r.pnote=r.pnote||{};r.pnote.what=t.value;}
  else if(a==="pnote2"){r.pnote=r.pnote||{};r.pnote.steps=t.value;}
  else if(a==="reflect"){r.reflect=t.value;}
});
render();
</script>
